<!doctype html>
<!--
  README banner. It embeds the real popup screenshots (../popup-light.png, ../popup-dark.png,
  made by popup-screenshots.mjs). Render both themes (#dark picks the dark one) with a
  Chromium-based browser, e.g.
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=960,400
           --default-background-color=00000000 --virtual-time-budget=5000
           --screenshot=hero-dark.png "file:///…/hero.html#dark"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IP Find banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --bg2: #f6f8fa; --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --card: #ffffff;
    --blue: #0969da; --green: #1a7f37; --purple: #8250df; --shadow: 0 1px 2px rgba(31,35,40,.06), 0 6px 18px rgba(31,35,40,.06);
    --pop: 0 2px 6px rgba(31,35,40,.08), 0 22px 48px rgba(31,35,40,.16);
    --tint1: rgba(9,105,218,.10); --tint2: rgba(26,127,55,.08);
  }
  .dark {
    --bg: #0d1117; --bg2: #151b23; --ink: #f0f6fc; --muted: #9198a1; --line: #3d444d; --card: #151b23;
    --blue: #4493f8; --green: #3fb950; --purple: #ab7df8; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --pop: 0 2px 6px rgba(0,0,0,.5), 0 22px 48px rgba(0,0,0,.55);
    --tint1: rgba(68,147,248,.16); --tint2: rgba(63,185,80,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { width: 960px; height: 400px; font-family: Inter, "Segoe UI", sans-serif; color: var(--ink); }
  .frame { position: relative; width: 960px; height: 400px; border-radius: 22px; overflow: hidden;
           border: 1px solid var(--line);
           background: radial-gradient(520px 300px at 88% 0%, var(--tint1), transparent 70%),
                       radial-gradient(420px 260px at 0% 100%, var(--tint2), transparent 70%), var(--bg); }
  .dots { position: absolute; inset: 0; opacity: .55;
          background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 22px 22px;
          -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 60%, #000 100%); }

  header { position: absolute; left: 44px; top: 40px; display: flex; align-items: center; gap: 18px; }
  .mark { width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(140deg, #1f6feb, #8957e5 60%, #1a7f37);
          display: grid; place-items: center; box-shadow: var(--shadow); }
  h1 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  .tag { margin: 8px 0 0; font-size: 18px; color: var(--muted); letter-spacing: -0.005em; }
  .tag b { color: var(--ink); font-weight: 600; }

  .features { position: absolute; left: 44px; top: 150px; width: 500px; display: flex; flex-direction: column; gap: 12px; }
  .feat { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; box-shadow: var(--shadow); padding: 12px 16px; }
  .feat i { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; margin-top: 1px;
            background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .feat i svg { width: 17px; height: 17px; }
  .feat b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .feat span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .feat code { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; color: var(--ink); }

  .toolbar { position: absolute; left: 584px; top: 30px; width: 340px; height: 42px; border-radius: 12px;
             background: var(--bg2); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; }
  .toolbar .url { font-variant-ligatures: none; flex: 1; height: 26px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
                  font: 500 12px "JetBrains Mono", Consolas, monospace; color: var(--muted); display: flex; align-items: center; padding: 0 12px; }
  .toolbar .btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--ink);
                  background: color-mix(in srgb, var(--blue) 16%, transparent); outline: 2px solid color-mix(in srgb, var(--blue) 45%, transparent); }
  .toolbar .btn svg { width: 17px; height: 17px; }
  .popup { position: absolute; left: 628px; top: 82px; width: 296px; border-radius: 12px; overflow: hidden;
           border: 1px solid var(--line); box-shadow: var(--pop); background: var(--bg); }
  .popup img { display: block; width: 100%; }
  .notch { position: absolute; left: 893px; top: 76px; width: 12px; height: 12px; transform: rotate(45deg);
           background: var(--bg); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<script>if (location.hash === '#dark') document.documentElement.className = 'dark';</script>
<div class="frame">
  <div class="dots"></div>

  <header>
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 4 9 14 14 0 0 1-4 9 14 14 0 0 1-4-9 14 14 0 0 1 4-9z"/>
      </svg>
    </div>
    <div>
      <h1>IP Find</h1>
      <p class="tag">Your public IP, and any other IP, <b>one click</b> away.</p>
    </div>
  </header>

  <div class="features">
    <div class="feat" style="--c: var(--green)">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg></i>
      <div><b>See your own IP</b><span>IPv4 or IPv6, with location, network and local time</span></div>
    </div>
    <div class="feat" style="--c: var(--blue)">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></i>
      <div><b>Look up any IP</b><span>ISP · ASN, timezone, coordinates on a map, e.g. <code>8.8.8.8</code></span></div>
    </div>
    <div class="feat" style="--c: var(--purple)">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></i>
      <div><b>Copy, paste, recent lookups</b><span>one-click copy, last 6 searches, light and dark theme</span></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="url">https://example.com</div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 4 9 14 14 0 0 1-4 9 14 14 0 0 1-4-9 14 14 0 0 1 4-9z"/></svg></div>
  </div>
  <div class="popup"><img id="shot" src="../popup-light.png" alt=""></div>
  <div class="notch"></div>
</div>
<script>if (location.hash === '#dark') document.getElementById('shot').src = '../popup-dark.png';</script>
</body>
</html>
